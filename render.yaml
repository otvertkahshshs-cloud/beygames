services:
  - type: web
    name: dealerhook-forum
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    disk:
      name: uploads
      mountPath: /opt/render/project/src/public/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dealerhook-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false   # вставишь вручную в Render Dashboard

databases:
  - name: dealerhook-db
    plan: free
